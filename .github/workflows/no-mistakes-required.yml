name: Require no-mistakes
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@5732d1ed88a1572fa6115d6ede5d69bfec097946 # v1.106.1
