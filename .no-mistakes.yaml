agent: codex

commands:
  prepare: "dotnet restore AMDN.sln --locked-mode && make crypto-restore && make contracts-restore"
  lint: "make lint"
  format: "dotnet format AMDN.sln --no-restore"

auto_fix:
  review: 0

document:
  instructions: |
    README.md owns onboarding and current implementation status.
    docs/adr owns architectural decisions; keep drafts Proposed until reviewed.
    docs/architecture owns boundaries; docs/security owns the threat model.
    docs/protocols owns wire and delivery semantics; docs/plan owns F0 gates.
    CONTRIBUTING.md owns hooks, verification and no-mistakes setup.
    AGENTS.md is concise shared agent memory; CLAUDE.md imports it.
    Do not claim F0 or security validation is complete from a scaffold alone.

test:
  instructions: |
    Run make test for the bootstrap health endpoint and hook behavior.
    Start the Gateway with dotnet run --project src/Gateway --no-launch-profile
    --urls http://127.0.0.1:5080 and check /health/live returns HTTP 200.
    No application messaging API or production cryptography is implemented yet; the isolated F0.3 experiment is separate.
    Do not treat the F0 scaffold as satisfying delivery or isolation tests.
    For F0.3, also run make crypto-test and make crypto-spike with Node from .nvmrc.
    The experiment uses only disposable synthetic data; never log client state.
    Native agent hook/sandbox validation remains separately pending per agent-safety.md.
    For F0.4, make contracts-test validates proposed OpenAPI, examples and transition
    graph invariants only. It does not prove live authorization, persistence or races.
    For F0.5 run make harness-test on Linux with local Docker Engine and Compose v2.
    It starts real disposable PostgreSQL/JetStream services, exercises fixture RLS,
    pooling and crash recovery, and removes only its own labeled resources.
    Missing Docker is a failed prerequisite, never a skipped passing test.
    Do not substitute mocks or disable sandbox restrictions to run Docker.
    Fixture identities/roles/pooling are not production integration evidence.
    Native N01/N02 remain pending even when the service harness passes.
    For F1.1 run the integration tests: real loopback Gateway and HTTPS OIDC
    discovery/JWKS fixtures validate signed access tokens and negative cases.
    Test-only probe routes are never deployed. Do not install fixture certificates
    or weaken production TLS. Provider rollout and P01-P03 remain pending.
    For F1.2 run make harness-test: actual identity migrations, separate runtime and
    provisioning roles, registration, RLS/pool reuse, revocation and a test-only
    authenticated HTTP probe supplement the delivery fixtures. Public owner and
    provisioning APIs remain F1.3 work; do not mark P01-P03 or N01/N02 complete.

pr:
  base_branch: main
  appendix: collapsed
