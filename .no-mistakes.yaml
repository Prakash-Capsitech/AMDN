agent: codex

commands:
  prepare: "dotnet restore AMDN.sln"
  lint: "make lint"
  format: "dotnet format AMDN.sln --no-restore"

auto_fix:
  review: 0

document:
  instructions: |
    README.md owns onboarding and current implementation status.
    docs/adr owns architectural decisions; keep drafts Proposed until reviewed.
    docs/architecture owns boundaries; docs/security owns the threat model.
    docs/protocols owns wire and delivery semantics; docs/plan owns F0 gates.
    CONTRIBUTING.md owns hooks, verification and no-mistakes setup.
    AGENTS.md is concise shared agent memory; CLAUDE.md imports it.
    Do not claim F0 or security validation is complete from a scaffold alone.

test:
  instructions: |
    Run make test for the bootstrap health endpoint and hook behavior.
    Start the Gateway with dotnet run --project src/Gateway --no-launch-profile
    --urls http://127.0.0.1:5080 and check /health/live returns HTTP 200.
    No messaging, authentication or cryptography is implemented yet.
    Do not treat the F0 scaffold as satisfying delivery or isolation tests.

pr:
  base_branch: main
  appendix: collapsed
